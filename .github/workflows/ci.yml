name: LASP checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Verify checksums
        run: sha256sum -c SHA256SUMS.txt
      - name: Check JavaScript syntax
        run: |
          node --check src/lasp-crypto.js
          node --check src/lasp-core.js
          node --check tests/adversarial-tests.cjs
      - name: Run adversarial and positive tests
        run: npm test
      - name: Check JSON/YAML metadata
        run: |
          python3 - <<'PY'
          import json
          json.load(open('package.json', encoding='utf-8'))
          print('package.json: OK')
          PY
